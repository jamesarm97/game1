<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!--HEAD-START-->
<title>Sparkle Island</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: full-screen 3D world; small candy-coloured HUD chips float at the edges. Single look by choice (a toy world). */
:root {
  --sky: #9fd8ff;
  --ink: #3a2352;
  --panel: rgba(255, 255, 255, .88);
  --pink: #ff5fa8;
  --sun: #ffd23f;
  --mint: #36cfa9;
  --display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; overflow: hidden; background: var(--sky); color: var(--ink);
  font-family: var(--body); font-weight: 600; font-size: 15px;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#ui {
  position: fixed; inset: 0; pointer-events: none; box-sizing: border-box;
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#uiIn { position: relative; width: 100%; height: 100%; }
.chip {
  position: absolute; background: var(--panel); border-radius: 18px; padding: 6px 14px;
  box-shadow: 0 3px 0 rgba(58, 35, 82, .18); font-family: var(--display); font-weight: 800;
}
#stars { top: 0; left: 0; font-size: 22px; line-height: 1.2; }
#mission { top: 48px; left: 0; max-width: min(62%, 420px); font-size: 16px; line-height: 1.25; border-left: 0; }
#mission small { display: block; font-family: var(--body); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--pink); }
#map { position: absolute; top: 0; right: 0; width: 112px; height: 112px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 3px 0 rgba(58, 35, 82, .2); background: #4fc3f7; }
#topBtns { position: absolute; top: 126px; right: 0; display: grid; grid-template-columns: 38px 38px; gap: 6px; pointer-events: auto; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
.rb {
  width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--panel);
  font-size: 18px; padding: 0; box-shadow: 0 3px 0 rgba(58, 35, 82, .18);
}
.rb:focus-visible, .slot:focus-visible, #play:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
#cross { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border: 3px solid #fff; border-radius: 50%; box-sizing: border-box; opacity: .85; box-shadow: 0 0 0 1px rgba(58, 35, 82, .35); }
#prompt { bottom: 70px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 17px; background: var(--sun); }
#toast {
  position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%) scale(.8); opacity: 0;
  font-family: var(--display); font-weight: 800; font-size: clamp(24px, 6vw, 44px); color: #fff; text-align: center;
  text-shadow: 0 3px 0 var(--pink), 0 6px 14px rgba(58, 35, 82, .35); transition: opacity .25s, transform .25s; width: 90%;
}
#toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
#hotbar { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; pointer-events: auto; background: var(--panel); padding: 5px; border-radius: 14px; }
.slot { width: 30px; height: 30px; border-radius: 8px; border: 3px solid transparent; padding: 0; box-sizing: border-box; box-shadow: inset 0 0 0 1px rgba(58, 35, 82, .25); transition: transform .12s; }
.slot.on { border-color: var(--ink); transform: translateY(-4px); }
#touch { position: absolute; inset: 0; }
#joy { position: absolute; left: 0; bottom: 56px; width: 124px; height: 124px; border-radius: 50%; background: rgba(255, 255, 255, .35); border: 3px solid rgba(255, 255, 255, .8); pointer-events: auto; touch-action: none; box-sizing: border-box; }
#knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: #fff; box-shadow: 0 3px 0 rgba(58, 35, 82, .2); }
#tbtns { position: absolute; right: 0; bottom: 56px; display: grid; grid-template-columns: 60px 60px; gap: 8px; pointer-events: auto; }
.tb { width: 60px; height: 60px; border-radius: 50%; border: 0; font-size: 26px; background: var(--panel); box-shadow: 0 4px 0 rgba(58, 35, 82, .2); touch-action: none; padding: 0; }
.tb:active { transform: translateY(3px); box-shadow: none; }
#tJump { background: var(--pink); }
#tFly { grid-column: 2; background: #d9c8ff; }
#tRide { background: var(--sun); }
#start {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; box-sizing: border-box;
  padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(159, 216, 255, .25);
}
#card { background: var(--panel); border-radius: 28px; padding: 20px 26px 22px; max-width: 460px; width: 100%; max-height: 100%; overflow: auto; box-sizing: border-box; text-align: center; box-shadow: 0 8px 0 rgba(58, 35, 82, .16); }
#card h1 { font-family: var(--display); font-weight: 800; font-size: clamp(38px, 11vw, 60px); line-height: .95; margin: 0 0 6px; color: var(--pink); text-shadow: 0 3px 0 var(--sun); text-wrap: balance; }
#card p { margin: 0 0 12px; }
#keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; text-align: left; margin: 0 auto 16px; font-size: 14px; width: fit-content; max-width: 100%; }
#keys b { font-family: var(--display); color: var(--ink); background: #fff; border-radius: 8px; padding: 0 8px; text-align: center; box-shadow: 0 2px 0 rgba(58, 35, 82, .18); white-space: nowrap; }
#play { font-family: var(--display); font-weight: 800; font-size: 26px; border: 0; border-radius: 999px; padding: 8px 44px; background: var(--pink); color: #fff; box-shadow: 0 5px 0 #c93a7d; }
.rb.off { opacity: .45; }
.link { margin-top: 12px; border: 0; background: none; font-size: 13px; text-decoration: underline; color: var(--ink); padding: 4px 8px; }
#sponsor { margin-top: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
#sponsor img { width: 200px; border-radius: 8px; display: block; }
#play:active { transform: translateY(4px); box-shadow: 0 1px 0 #c93a7d; }
@media (max-height: 460px) { #mission { top: 0; left: 96px; } #joy, #tbtns { bottom: 48px; } #card h1 { font-size: 34px; } }
@media (prefers-reduced-motion: reduce) { #toast, .slot { transition: none; } }
</style>
<!--HEAD-END-->
</head>
<body>
<!--BODY-START-->
<canvas id="game" tabindex="0"></canvas>
<div id="ui"><div id="uiIn">
  <div id="stars" class="chip">⭐ <span id="starN">0</span></div>
  <div id="mission" class="chip"><small>Mission</small><span id="missionT">Find a unicorn and hop on!</span></div>
  <canvas id="map" width="144" height="144"></canvas>
  <div id="topBtns">
    <button class="rb" id="bOutfit" title="Change outfit (C)" aria-label="Change outfit">👗</button>
    <button class="rb" id="bMusic" title="Music on or off" aria-label="Music on or off">🎵</button>
    <button class="rb" id="bSound" title="Sound on or off" aria-label="Sound on or off">🔊</button>
    <button class="rb" id="bHelp" title="How to play" aria-label="How to play">❓</button>
  </div>
  <div id="cross"></div>
  <div id="prompt" class="chip" hidden></div>
  <div id="toast"></div>
  <div id="touch" hidden>
    <div id="joy"><div id="knob"></div></div>
    <div id="tbtns">
      <button class="tb" id="tFly" aria-label="Unicorn wings" hidden>🪽</button>
      <button class="tb" id="tBreak" aria-label="Break block">⛏️</button>
      <button class="tb" id="tPlace" aria-label="Place block">🧱</button>
      <button class="tb" id="tRide" aria-label="Ride or hop off">🦄</button>
      <button class="tb" id="tJump" aria-label="Jump">⬆️</button>
    </div>
  </div>
  <div id="hotbar"></div>
</div></div>
<div id="start">
  <div id="card">
    <h1>Sparkle Island</h1>
    <p>Ride unicorns, zoom around in toy cars, make friends with dinosaurs and build anything you like. June Bug the dog comes along too.</p>
    <div id="keys"></div>
    <button id="play">Play</button>
    <div><button id="gfx" class="link">Switch to HD graphics</button> <button id="reset" class="link" hidden>Start a new game</button></div>
    <div id="sponsor" hidden><span>Brought to you by</span><img id="logoImg" alt="24HR Flood Pros"></div>
  </div>
</div>
<script src="vendor/three.min.js"></script>
<script src="logo.js?v=7"></script>
<script src="game.js?v=7"></script>
<!--BODY-END-->
</body>
</html>
