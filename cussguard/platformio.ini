; CussGuard (M5Dial edition) — SRT-synced IR TV muter on an M5Stack Dial
; Build & upload firmware:   pio run -t upload
; Build & upload web UI/FS:  pio run -t uploadfs
;
; The M5Dial is an ESP32-S3 (M5StampS3) with a built-in rotary encoder,
; a round 240x240 GC9A01 LCD, and a pressable dial (BtnA). Only two external
; pins are used: Port B G2 = IR transmit, G1 = IR receive.
[env:m5dial]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
lib_deps =
    m5stack/M5Dial @ ^1.0.3
    crankyoldgit/IRremoteESP8266 @ ^2.8.0
    esphome/ESPAsyncWebServer-esphome @ ^3.1.0
    esphome/AsyncTCP-esphome @ ^2.0.0
    bblanchon/ArduinoJson @ ^7.0.0
build_flags =
    -D CORE_DEBUG_LEVEL=2
    -D BOARD_HAS_PSRAM=0
